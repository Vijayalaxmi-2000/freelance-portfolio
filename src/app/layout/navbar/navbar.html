<nav class="navbar">
  <div class="container navbar__container">

    <!-- Logo -->
    <a
      class="navbar__logo"
      href="#home"
      aria-label="Vijayalaxmi Bewoor - Home"
      (click)="closeMenu()"
    >
      <img
        src="assets/images/vijuLogo.jpg"
        alt="Vijayalaxmi Bewoor" 
        class="navbar__logo-image"
      />
    </a>


    <!-- Desktop Navigation -->
    <div class="navbar__links">

      <a
        href="#home"
        class="navbar__link"
        (click)="closeMenu()"
      >
        Home
      </a>

      <a
        href="#about"
        class="navbar__link"
        (click)="closeMenu()"
      >
        About
      </a>

      <a
        href="#services"
        class="navbar__link"
        (click)="closeMenu()"
      >
        Services
      </a>

      <a
        href="#projects"
        class="navbar__link"
        (click)="closeMenu()"
      >
        Projects
      </a>

      <a
        href="#contact"
        class="navbar__link"
        (click)="closeMenu()"
      >
        Contact
      </a>

    </div>


    <!-- CTA -->
   <a
  href="#contact"
  class="btn btn-primary navbar__cta"
  (click)="closeMenu()"
>
  Let's Talk
</a>


    <!-- Mobile Menu -->
    <button
      class="navbar__menu-button"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span class="material-icons">
        {{ menuOpen ? 'close' : 'menu' }}
      </span>
    </button>

  </div>


  <!-- Mobile Navigation -->
  <div
    class="navbar__mobile-menu"
    [class.navbar__mobile-menu--open]="menuOpen"
  >

    <a
      href="#home"
      class="navbar__mobile-link"
      (click)="closeMenu()"
    >
      Home
    </a>

    <a
      href="#about"
      class="navbar__mobile-link"
      (click)="closeMenu()"
    >
      About
    </a>

    <a
      href="#services"
      class="navbar__mobile-link"
      (click)="closeMenu()"
    >
      Services
    </a>

    <a
      href="#projects"
      class="navbar__mobile-link"
      (click)="closeMenu()"
    >
      Projects
    </a>

    <a
      href="#contact"
      class="navbar__mobile-link"
      (click)="closeMenu()"
    >
      Contact
    </a>

    <a
      href="#contact"
      class="btn btn-primary navbar__mobile-cta"
      (click)="closeMenu()"
    >
      Let's Talk
    </a>

  </div>

</nav>
