<nav class="navbar sticky-top w-100 bg-white border-bottom">
  <div class="container navbar__container d-flex align-items-center gap-3">

    <!-- Logo -->
    <a
      routerLink="/home"
      class="navbar__logo d-inline-flex align-items-center flex-shrink-0"
      aria-label="Vijayalaxmi Bewoor - Home"
      (click)="closeMenu()"
    >
      <img
        src="assets/images/Logo_Viju.png"
        alt="Vijayalaxmi Bewoor"
        class="navbar__logo-image"
      />
    </a>

    <!-- Desktop Navigation -->
    <div class="navbar__links d-none d-md-flex align-items-center gap-4 ms-auto">

      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar__link"
      >
        Home
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active"
        class="navbar__link"
      >
        About
      </a>

      <a
        routerLink="/services"
        routerLinkActive="active"
        class="navbar__link"
      >
        Services
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        class="navbar__link"
      >
        Projects
      </a>

     

    </div>

    <!-- Desktop CTA -->
    <a
      routerLink="/contact"
      class="btn btn-primary navbar__cta d-none d-md-inline-flex flex-shrink-0 px-3"
    >
      Let's Talk
    </a>

    <!-- Mobile Menu Button -->
    <button
      class="navbar__menu-button d-inline-flex d-md-none align-items-center justify-content-center ms-auto"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span class="material-icons">
        {{ menuOpen ? 'close' : 'menu' }}
      </span>
    </button>

  </div>

  <!-- Mobile Navigation -->
  <div
    class="navbar__mobile-menu d-md-none"
    [class.navbar__mobile-menu--open]="menuOpen"
  >

    <div class="navbar__mobile-links">

      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar__mobile-link"
        (click)="closeMenu()"
      >
        Home
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active"
        class="navbar__mobile-link"
        (click)="closeMenu()"
      >
        About
      </a>

      <a
        routerLink="/services"
        routerLinkActive="active"
        class="navbar__mobile-link"
        (click)="closeMenu()"
      >
        Services
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        class="navbar__mobile-link"
        (click)="closeMenu()"
      >
        Projects
      </a>


      <a
        routerLink="/contact"
        class="btn btn-primary navbar__mobile-cta"
        (click)="closeMenu()"
      >
        Let's Talk
      </a>

    </div>

  </div>

</nav>
