<nav class="navbar">
  <div class="container navbar__container">

    <!-- Logo -->
    <a class="navbar__logo" href="#home" (click)="closeMenu()">
      <span class="navbar__logo-name">Vijayalaxmi Bewoor</span>
    </a>

    <!-- Desktop / Tablet Navigation -->
    <div class="navbar__links">
      <a href="#home" class="navbar__link">Home</a>
      <a href="#about" class="navbar__link">About</a>
      <a href="#services" class="navbar__link">Services</a>
      <a href="#projects" class="navbar__link">Projects</a>
      <a href="#contact" class="navbar__link">Contact</a>
    </div>

    <!-- CTA -->
    <a href="#contact" class="navbar__cta">
      Let's Talk
    </a>

    <!-- Theme Toggle -->
    <button
      class="navbar__theme-toggle"
      type="button"
      aria-label="Toggle theme"
      (click)="toggleTheme()"
      [attr.aria-pressed]="theme === 'dark'"
    >
      {{ theme === 'dark' ? '🌙' : '☀️' }}
    </button>
    <!-- Mobile Menu Button -->
    <button
      class="navbar__menu-button"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- Mobile Navigation -->
  <div class="navbar__mobile-menu" [class.navbar__mobile-menu--open]="menuOpen">

    <a href="#home" class="navbar__mobile-link" (click)="closeMenu()">
      Home
    </a>

    <a href="#about" class="navbar__mobile-link" (click)="closeMenu()">
      About
    </a>

    <a href="#services" class="navbar__mobile-link" (click)="closeMenu()">
      Services
    </a>

    <a href="#projects" class="navbar__mobile-link" (click)="closeMenu()">
      Projects
    </a>

    <a href="#contact" class="navbar__mobile-link" (click)="closeMenu()">
      Contact
    </a>

    <a href="#contact" class="navbar__mobile-cta" (click)="closeMenu()">
      Let's Talk
    </a>
  </div>
</nav>
